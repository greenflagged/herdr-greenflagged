[tool.poetry]
name = "poetry-demo"
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31"
PyYAML = { version = ">=6.0", extras = ["LibYAML"], markers = "sys_platform != 'win32'" }
local-lib = { path = "../local-lib", develop = true }
forked = { git = "https://github.com/example/forked.git", branch = "main" }

[tool.poetry.group.main.dependencies]
click = "^8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
requests = "^1.0"

[tool.poetry.dev-dependencies]
black = "^24.0"

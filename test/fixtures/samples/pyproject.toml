[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo"
version = "0.1.0"
description = "A demo project for the TOML reader's tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2,<3",  # v1 API is gone
]

[project.optional-dependencies]
cli = ["rich>=13"]

[project.scripts]
demo = "demo.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.report]
fail_under = 90.5

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[[tool.poetry.source]]
name = "internal"
url = "https://pypi.example.com/simple/"
priority = "supplemental"
